name: elt-infra

x-airflow-common: &airflow-common
  image: elt-infra-airflow:local
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    DBT_PROFILES_DIR: /opt/airflow/dbt/elt_smoke
    DBT_PROJECT_DIR: /opt/airflow/dbt/elt_smoke
    TRINO_HOST: trino
    TRINO_PORT: "8080"
    TRINO_USER: airflow
  user: "${AIRFLOW_UID}:0"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./dbt:/opt/airflow/dbt
    - airflow_logs:/opt/airflow/logs
  networks:
    - elt_net

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - elt_net

  serving-postgres:
    # gold 서빙 DB(도메인 공용) — Airflow 메타데이터용 postgres 와 분리된 전용 컨테이너.
    # commerce gold(commerce_* 테이블/뷰)는 commerce_load_gold DAG 가 여기로 적재한다.
    # 루트 .env 를 env_file 로 주입하지 않는다(API 키 등 무관 시크릿 격리) — 필요한 값만 명시.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SERVING_POSTGRES_USER:-serving}
      POSTGRES_PASSWORD: ${SERVING_POSTGRES_PASSWORD:-serving}   # dev 기본값 — prod 는 .env 로 교체
      POSTGRES_DB: ${SERVING_POSTGRES_DB:-serving}
    volumes:
      - serving_postgres_data:/var/lib/postgresql/data
    ports:
      # DBeaver/DataGrip 접속용. 인증은 password 뿐 → 127.0.0.1 전용 바인드(LAN 미노출, trino 관례 동일).
      - "127.0.0.1:30587:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVING_POSTGRES_USER:-serving} -d ${SERVING_POSTGRES_DB:-serving}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - elt_net

  trino:
    image: trinodb/trino:latest
    env_file:
      - .env
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    ports:
      # Trino HTTP(8080) → 호스트 30586. DBeaver/DataGrip 접속용.
      # Trino 기본 인증 없음 → 127.0.0.1 전용 바인드(LAN 미노출).
      - "127.0.0.1:30586:8080"
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - elt_net

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
        chown -R "$${AIRFLOW_UID}:0" /opt/airflow/logs /opt/airflow/plugins /opt/airflow/config
        /entrypoint airflow db migrate
        /entrypoint airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" || true
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "30585:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
      trino:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

volumes:
  postgres_data:
  serving_postgres_data:
  airflow_logs:

networks:
  elt_net:
    name: elt_net
