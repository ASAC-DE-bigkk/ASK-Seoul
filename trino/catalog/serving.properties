# gold 서빙 DB(PostgreSQL, compose serving-postgres) — Trino 페더레이션 카탈로그.
# 이 카탈로그로 gold(commerce_* 테이블/뷰)를 iceberg_dev(silver)와 **같은 Trino 연결**에서 조회한다:
#   serving.public.commerce_business_entity · serving.public.commerce_v_food_sanitation_business ...
# 시크릿은 커밋하지 않는다 — trino 컨테이너 env(SERVING_POSTGRES_*, compose 기본 serving)로 주입.
connector.name=postgresql
connection-url=jdbc:postgresql://serving-postgres:5432/serving
connection-user=${ENV:SERVING_POSTGRES_USER}
connection-password=${ENV:SERVING_POSTGRES_PASSWORD}
